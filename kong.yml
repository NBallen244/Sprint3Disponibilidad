_format_version: "2.1"

services:
  - host: monitoring_upstream
    name: monitoring_service
    protocol: http
    routes:
      
      - name: monitoring
        paths:
          - /historias
        strip_path: false

  
    
upstreams:
  - name: monitoring_upstream
    targets:
      - target: <ip-privada-monitoring-app-a>:8080
        weight: 100
      - target: <ip-privada-monitoring-app-b>:8080
        weight: 100
      - target: <ip-privada-monitoring-app-c>:8080
        weight: 100
    healthchecks:
      threshold: 35
      active:
        http_path: /health/
        timeout: 5
        healthy:
          successes: 3
          interval: 5
        unhealthy:
          tcp_failures: 1
          interval: 6



